id: aws-eks-sqs
version: 1.0.0
display_name: Amazon SQS
signals:
  packages:
    - "@aws-sdk/client-sqs"
  imports:
    - "SQSClient"
    - "SendMessageCommand"
  environment_variables:
    - "ORDERS_QUEUE_URL"
module:
  source: "git::https://github.com/stackgen-demo/autonomous-factory-terraform-library.git//modules/aws-eks-sqs?ref=v1.0.0"
  template: templates/aws/eks-sqs-dependency/dependency.tf.tftpl
generation:
  terraform_filename: dependency-sqs.tf
  allowed_paths:
    - infra/dependency-sqs.tf
    - helm/autonomous-factory-demo/values-dev.yaml
    - catalog-info.yaml
helm_values_template: templates/aws/eks-sqs-dependency/values-dev.yaml.tftpl
required_iam_actions:
  - "sqs:GetQueueAttributes"
  - "sqs:SendMessage"
validation:
  - "tofu fmt -check"
  - "tofu init -backend=false"
  - "tofu validate"
  - "helm lint ./helm/autonomous-factory-demo"
