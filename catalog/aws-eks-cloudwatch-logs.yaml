id: aws-eks-cloudwatch-logs
version: 1.2.0
display_name: CloudWatch Logs
signals:
  packages:
    - "@aws-sdk/client-cloudwatch-logs"
  imports:
    - "CloudWatchLogsClient"
    - "PutLogEventsCommand"
  environment_variables:
    - "AUDIT_LOG_GROUP_NAME"
module:
  source: "git::https://github.com/stackgen-demo/autonomous-factory-terraform-library.git//modules/aws-eks-cloudwatch-logs?ref=v1.2.0"
  template: templates/aws/eks-cloudwatch-logs-dependency/dependency.tf.tftpl
generation:
  terraform_filename: dependency-cloudwatch-logs.tf
  allowed_paths:
    - infra/dependency-cloudwatch-logs.tf
    - harness/manifests/autonomous-factory-demo.yaml
    - catalog-info.yaml
deployment:
  manifest_env_template: templates/aws/eks-cloudwatch-logs-dependency/deployment-env.yaml.tftpl
required_iam_actions:
  - "logs:CreateLogStream"
  - "logs:DescribeLogStreams"
  - "logs:PutLogEvents"
validation:
  - "tofu fmt -check"
  - "tofu init -backend=false"
  - "tofu validate"
  - "helm lint ./helm/autonomous-factory-demo"
