version: 1
policy_owner: platform-team
description: >-
  Approved dependency-to-infrastructure mappings for participating Autonomous
  Factory applications. Application repositories may declare identity,
  environment eligibility, and requested capabilities, but never module,
  template, IAM, or catalog-version selection.
delivery_pipeline:
  identifier: autonomous_factory_dev_pipeline
  template_path: templates/harness/autonomous-factory-dev-pipeline.yaml
  harness_schema: pipeline
  source_repository: stackgen-demo/autonomous-factory-demo
  source_branch: main
  source_file_path: .harness/pipelines/autonomous-factory-dev.yaml
  connector_ref: autonomous_factory_github
  validation:
    - harness_yaml_schema
    - harness_pipeline_dry_run
  immutable_scope:
    organization: default
    project: cloudos_software_factory
    delegate_selector: demo-env
    environment: dev
    cluster: ai-sre-demo
terraform_roots:
  - id: aws-eks-dev
    version: 1.0.0
    destination: infra
    template_path: templates/terraform-root/aws-eks-dev
    files:
      - backend.tf
      - main.tf
      - outputs.tf
      - providers.tf
      - variables.tf
      - versions.tf
      - .terraform.lock.hcl
    backend:
      type: s3
      bucket: autonomous-factory-tfstate-697091778198-us-west-2
      key: autonomous-factory-demo/dev/terraform.tfstate
      region: us-west-2
      locking: s3-use-lockfile
      encrypted: true
    immutable_scope:
      account: "697091778198"
      region: us-west-2
      environment: dev
      cluster: ai-sre-demo
      namespace: autonomous-factory-dev
    validation:
      - tofu_fmt_check
      - tofu_init_backend_false
      - tofu_validate
      - tofu_speculative_plan
      - create_only_plan_policy
    approved_resource_prefixes:
      - aws_ecr_repository.application
      - aws_iam_role.application
      - kubernetes_namespace_v1.application
      - kubernetes_service_account_v1.application
      - module.orders_queue
      - module.audit_log_group
dependency_mappings:
  - catalog_entry: aws-eks-sqs
    catalog_path: catalog/aws-eks-sqs.yaml
    signals:
      packages:
        - "@aws-sdk/client-sqs"
      imports:
        - SQSClient
        - GetQueueAttributesCommand
        - SendMessageCommand
      environment_variables:
        - ORDERS_QUEUE_URL
  - catalog_entry: aws-eks-sns
    catalog_path: catalog/aws-eks-sns.yaml
    signals:
      packages:
        - "@aws-sdk/client-sns"
      imports:
        - SNSClient
        - PublishCommand
      environment_variables:
        - EVENTS_TOPIC_ARN
  - catalog_entry: aws-eks-cloudwatch-logs
    catalog_path: catalog/aws-eks-cloudwatch-logs.yaml
    signals:
      packages:
        - "@aws-sdk/client-cloudwatch-logs"
      imports:
        - CloudWatchLogsClient
        - PutLogEventsCommand
      environment_variables:
        - AUDIT_LOG_GROUP_NAME
